services:
  # Backend Web Service on Render
  - type: web
    name: shopgenie-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn backend.run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shopgenie-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://shopgenie-ai.vercel.app

databases:
  # PostgreSQL Database on Render (or connect Supabase via DATABASE_URL)
  - name: shopgenie-db
    databaseName: shopgenie
    user: shopgenie_user
    plan: free
    region: oregon

